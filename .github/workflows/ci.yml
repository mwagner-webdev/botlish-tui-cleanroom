name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  BOT: ${{ github.workspace }}/botlish-linux-x86_64
  # Where the compiler is downloaded from when it is not in the repository.
  # Override with the repository variable BOTLISH_COMPILER_URL if needed.
  DEFAULT_COMPILER_URL: https://github.com/mwagner-webdev/botlish/releases/download/single-latest/botlish-linux-x86_64

jobs:
  test:
    name: library tests (all backends)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Obtain the compiler
        env:
          BOTLISH_COMPILER_URL: ${{ vars.BOTLISH_COMPILER_URL || env.DEFAULT_COMPILER_URL }}
        run: |
          if [ ! -f "$BOT" ]; then
            curl -fsSL "$BOTLISH_COMPILER_URL" -o "$BOT"
          fi
          chmod +x "$BOT"
          "$BOT" -version
          sudo apt-get install -y bc >/dev/null
      - name: Link the package into the authoring project
        run: cd dev && "$BOT" install
      - name: Portable tests, every backend
        run: scripts/run_tests.sh "$PWD/dev" | tee test-results.txt
      - name: Native-only adapter test (no terminal)
        run: cd dev && "$BOT" -warnings error -backend cranelift test_session.bot < /dev/null | grep -q "4 passed, 0 failed"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results.txt

  pack:
    name: deterministic packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Obtain the compiler
        env:
          BOTLISH_COMPILER_URL: ${{ vars.BOTLISH_COMPILER_URL || env.DEFAULT_COMPILER_URL }}
        run: |
          if [ ! -f "$BOT" ]; then
            curl -fsSL "$BOTLISH_COMPILER_URL" -o "$BOT"
          fi
          chmod +x "$BOT"
          "$BOT" -version
      - name: Pack tui and tui_event_loop_linux twice and compare with dist/
        run: scripts/pack_all.sh
      - name: dist/tui-0.1.0.botpkg is still the released artifact
        run: |
          echo "d442e0d42e18343de43c4cea2345202f0bcbc08267310a4c439a7173413d0ffa  dist/tui-0.1.0.botpkg" | sha256sum -c -
      - name: dist/upstream/event_loop_linux is the recorded release of the Botlish repository
        run: |
          sha=$(sha256sum dist/upstream/event_loop_linux-0.5.0.botpkg | cut -d' ' -f1)
          curl -fsSL https://raw.githubusercontent.com/mwagner-webdev/botlish/main/packages/RELEASES.tsv | grep -P "^event_loop_linux\t0.5.0\t$sha\$"

  consumer:
    name: consumer project and real-PTY acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Obtain the compiler
        env:
          BOTLISH_COMPILER_URL: ${{ vars.BOTLISH_COMPILER_URL || env.DEFAULT_COMPILER_URL }}
        run: |
          if [ ! -f "$BOT" ]; then
            curl -fsSL "$BOTLISH_COMPILER_URL" -o "$BOT"
          fi
          chmod +x "$BOT"
          "$BOT" -version
          sudo apt-get install -y bc >/dev/null
      - name: Install the artifact and verify
        working-directory: consumer
        run: |
          "$BOT" install
          "$BOT" verify
      - name: Installed files match the copies used by the consumer
        working-directory: consumer
        run: |
          for f in taskapp demo test hello; do cmp $f.bot .bot_modules/tui/examples/$f.bot; done
          for f in test_canvas test_ansi test_input test_layout test_widgets test_host test_session; do cmp $f.bot .bot_modules/tui/tests/$f.bot; done
      - name: Consumer tests (fast backends)
        run: |
          cd consumer
          for t in test_canvas test_ansi test_input test_layout test_widgets test_host test menu_test; do
            for be in compile cranelift cranelift-generic; do
              out=$("$BOT" -warnings error -backend $be $t.bot < /dev/null 2>&1)
              echo "$t $be: $(echo "$out" | grep -o '[0-9]* passed, [0-9]* failed' | tail -1)"
              echo "$out" | grep -q " 0 failed" || { echo "$out" | head -20; exit 1; }
            done
          done
      - name: Build the demo natively
        working-directory: consumer
        run: |
          "$BOT" -warnings error -emit-native-executable demo.bot
      - name: PTY acceptance (external driver, 26 checks)
        working-directory: consumer
        run: python3 -B .bot_modules/tui/tests/pty_acceptance.py ./demo

  evloop:
    name: event-loop consumer (independent package consumption, real PTY)
    # Needs a compiler whose package manager shares one instance of a dependency (the
    # single-latest build of 2026-10-21 installs a copy per path and fails with
    # LINK-CONFLICT): set the repository variable BOTLISH_COMPILER_URL to one that does.
    if: ${{ vars.BOTLISH_COMPILER_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Obtain the compiler
        env:
          BOTLISH_COMPILER_URL: ${{ vars.BOTLISH_COMPILER_URL || env.DEFAULT_COMPILER_URL }}
        run: |
          if [ ! -f "$BOT" ]; then
            curl -fsSL "$BOTLISH_COMPILER_URL" -o "$BOT"
          fi
          chmod +x "$BOT"
          "$BOT" -version
          sudo apt-get install -y strace >/dev/null
      - name: Install the artifacts (tui, event_loop_linux, tui_event_loop_linux) and verify
        working-directory: consumer-evloop
        run: |
          "$BOT" install
          "$BOT" verify
      - name: The consumer's copies are the installed package's files
        working-directory: consumer-evloop
        run: |
          for f in evdemo monitor control minimal; do cmp $f.bot .bot_modules/tui_event_loop_linux/examples/$f.bot; done
          for f in evcases evlinger test_monitor bench_standalone; do cmp $f.bot .bot_modules/tui_event_loop_linux/tests/$f.bot; done
      - name: Documented examples compile without warnings
        working-directory: consumer-evloop
        run: |
          "$BOT" -check -warnings error evdemo.bot
          "$BOT" -check -warnings error minimal.bot
      - name: Pure tests of the demonstration application
        working-directory: consumer-evloop
        run: |
          for be in compile cranelift; do
            "$BOT" -warnings error -backend $be test_monitor.bot | grep -q " 0 failed"
          done
      - name: Build the native programs
        working-directory: consumer-evloop
        run: |
          "$BOT" -warnings error -emit-native-executable evdemo.bot
          "$BOT" -emit-native-executable evcases.bot
          "$BOT" -emit-native-executable bench_standalone.bot
      - name: PTY acceptance (watchdog inside)
        working-directory: consumer-evloop
        run: python3 -B -u .bot_modules/tui_event_loop_linux/tests/pty_evloop.py ./evdemo
      - name: Lifecycle cases and strace fault injection
        working-directory: consumer-evloop
        run: python3 -B -u .bot_modules/tui_event_loop_linux/tests/pty_faults.py ./evcases ./evdemo

  mutation:
    name: "mutation tests of the integration (manual, long)"
    if: ${{ github.event_name == 'workflow_dispatch' && vars.BOTLISH_COMPILER_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Obtain the compiler
        env:
          BOTLISH_COMPILER_URL: ${{ vars.BOTLISH_COMPILER_URL || env.DEFAULT_COMPILER_URL }}
        run: |
          if [ ! -f "$BOT" ]; then
            curl -fsSL "$BOTLISH_COMPILER_URL" -o "$BOT"
          fi
          chmod +x "$BOT"
          sudo apt-get install -y strace >/dev/null
      - run: python3 -B -u tui_event_loop_linux/tests/mutate.py "$PWD" "$BOT" --jobs 4
